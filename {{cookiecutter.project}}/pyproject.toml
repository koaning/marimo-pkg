
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "{{cookiecutter.project}}"
version = "0.1.0"
description="Domain specific environment for dice"

license = {file = "LICENSE"}
readme = "README.md"


classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "marimo"
]

[project.urls]
repository = "https://github.com/{{cookiecutter.github_user}}/{{cookiecutter.project}}"
issue-tracker = "https://github.com/{{cookiecutter.github_user}}/{{cookiecutter.project}}/issues"
documentation = "https://{{cookiecutter.github_user}}.github.io/{{cookiecutter.project}}/"

[tool.setuptools.packages.find]
include = ["{{cookiecutter.project}}*"]
exclude = [
    "docs",
    "imgs",
    "nbs",
    "tests",
]