
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dicekit"
version = "0.1.0"
description="Domain specific environment for dice"

license = {file = "LICENSE"}
readme = "README.md"


classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "altair", "pandas", "marimo"
]

[project.urls]
repository = "https://github.com/koaning/mohtml"
issue-tracker = "https://github.com/koaning/mohtml/issues"
documentation = "https://koaning.github.io/mohtml/"

[tool.setuptools.packages.find]
include = ["{{cookiecutter.project}}*"]
exclude = [
    "docs",
    "images",
    "notebooks",
    "tests",
]